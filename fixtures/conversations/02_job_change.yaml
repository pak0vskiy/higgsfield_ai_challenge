user_id: u_bob
description: "User changes jobs across sessions — Stripe superseded by Notion"
turns:
  - session_id: s1
    timestamp: "2025-02-01T10:00:00Z"
    messages:
      - role: user
        content: "I work at Stripe as an engineer."
      - role: assistant
        content: "That sounds like an exciting role!"
  - session_id: s2
    timestamp: "2025-03-15T10:00:00Z"
    messages:
      - role: user
        content: "I just started at Notion last week. Really excited about the new role."
      - role: assistant
        content: "Congratulations on the new job!"
probes:
  - query: "Where does the user work?"
    must_include: ["Notion"]
    description: >
      Notion should be the active employer. Stripe may appear as previous employer
      in the profile summary — that is expected correct behavior (history preserved).
  - query: "Did the user work at Stripe?"
    must_include: ["Stripe"]
    description: "Stripe history should be preserved (superseded, not deleted)"
